[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22",
    "alembic>=1.20",
    "fastapi>=0.115,<1.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.7,<3.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pymupdf>=1.25,<2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]
